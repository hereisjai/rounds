name = "rounds"
main = "src/worker.js"
compatibility_date = "2026-10-27"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/api/laundry/*", "/laundry", "/laundry.html"]

[[d1_databases]]
binding = "DB"
database_name = "rounds"
database_id = "b65aa29e-023e-4044-b1f9-02af2a238604"

# Laundry books (/laundry) stay locked until these exist as Worker secrets.
# Set them in the dashboard or with wrangler. Never commit the values.
#   npx wrangler secret put LAUNDRY_USER
#   npx wrangler secret put LAUNDRY_PASSWORD
#   npx wrangler secret put LAUNDRY_SESSION_SECRET
